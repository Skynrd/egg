<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="format-detection" content="telephone=no" />
    <title>Ascension Planner</title>
    <meta name="description" content="Ascension planner for Egg, Inc." />
    <script>
      // Apply the saved/system theme before first paint to avoid a light flash (see src/composables/useTheme.ts).
      try {
        var t = localStorage.getItem('ascension_theme');
        if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app" class="min-h-screen bg-gray-100 dark:bg-[#0b1120]">
      <div class="app-loading p-4 text-center text-gray-500">Loading application...</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
    <script
      data-goatcounter="https://wasmegg-carpet.goatcounter.com/count"
      async
      src="//gc.zgo.at/count.js"
    ></script>
  </body>
</html>
